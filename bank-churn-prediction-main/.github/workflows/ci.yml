name: CI Pipeline — Banka Churn Tahmin Projesi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CHURN_API_KEY: ci_test_api_key
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  lint-and-test:
    name: 🔍 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodu indir
        uses: actions/checkout@v4

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: 🔎 Lint (flake8)
        run: |
          flake8 main.py dashboard.py run.py core/ services/ agents/ scripts/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402 \
            --count --show-source --statistics

      - name: 🧪 Testleri çalıştır
        run: |
          python -m pytest tests/ -v --tb=short -q

  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: 📥 Kodu indir
        uses: actions/checkout@v4

      - name: 🏗️ Docker imajını oluştur
        run: docker build -t churn-api:ci-test .

      - name: ✅ Docker imajı doğrula
        run: |
          docker run --rm -d --name ci_churn_test \
            -e CHURN_API_KEY=docker_test_key \
            -p 8000:8000 \
            churn-api:ci-test
          sleep 5
          curl -f http://localhost:8000/ || exit 1
          docker stop ci_churn_test
