name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f bank-churn-prediction-main/requirements.txt ]; then pip install -r bank-churn-prediction-main/requirements.txt; fi

    - name: Lint with flake8
      run: |
        # E402 module level import not at top of file, vb. ignore edilebilir.
        flake8 bank-churn-prediction-main --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 bank-churn-prediction-main --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --extend-ignore=E402

    - name: Test with pytest
      env:
        CHURN_API_KEY: 'test_api_key'
      run: |
        cd bank-churn-prediction-main
        python -m pytest --cov=. --cov-report=xml tests/

    - name: Run QA Agent
      env:
        CHURN_API_KEY: 'test_api_key'
      run: |
        cd bank-churn-prediction-main
        python qa_agent.py
        cat ../QA_REPORT.md
